<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Visites</title>
    <link rel="stylesheet" href="/css/visites.css">
</head>
<body>
    <main class="page">
        <section class="report-card" aria-labelledby="visites-title">
            <h1 id="visites-title">Informe de Visites</h1>
            <p class="subtitle">Consulta les visites de la base de dades o filtra per dates.</p>

            <form id="filters-form" class="filters" novalidate>
                <div class="field">
                    <label for="report-date">Data inici</label>
                    <input id="report-date" name="report-date" type="date">
                </div>
                <div class="field">
                    <label for="report-end-date">Data fi</label>
                    <input id="report-end-date" name="report-end-date" type="date">
                </div>
                <button id="load-btn" type="submit">Carregar informe</button>
            </form>

            <p id="message" class="message" role="status">Carregant informe per defecte...</p>

            <div id="results" hidden>
                <div class="table-wrap">
                    <table aria-label="Resultats informe visites">
                        <thead>
                            <tr>
                                <th scope="col">Data</th>
                                <th scope="col">Hora</th>
                                <th scope="col">Pacient</th>
                                <th scope="col">Metge</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
                <p id="empty" class="empty" hidden>No hi ha visites per a aquest filtre.</p>
            </div>

            <a class="back-link" href="/home">Tornar al menu</a>
        </section>
    </main>

    <script>
        const form = document.getElementById('filters-form');
        const dateInput = document.getElementById('report-date');
        const endDateInput = document.getElementById('report-end-date');
        const messageEl = document.getElementById('message');
        const resultsEl = document.getElementById('results');
        const rowsEl = document.getElementById('rows');
        const emptyEl = document.getElementById('empty');

        const setMessage = (text, isError = false) => {
            messageEl.hidden = false;
            messageEl.textContent = text;
            messageEl.classList.toggle('error', isError);
        };

        const renderRows = (data) => {
            rowsEl.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) {
                emptyEl.hidden = false;
                resultsEl.hidden = false;
                return;
            }

            emptyEl.hidden = true;
            data.forEach((visit) => {
                const tr = document.createElement('tr');

                const tdData = document.createElement('td');
                tdData.textContent = visit.data_visita ?? '-';

                const tdHora = document.createElement('td');
                tdHora.textContent = visit.hora_visita ?? '-';

                const tdPacient = document.createElement('td');
                tdPacient.textContent = visit.pacient ?? '-';

                const tdMetge = document.createElement('td');
                tdMetge.textContent = visit.metge ?? '-';

                tr.appendChild(tdData);
                tr.appendChild(tdHora);
                tr.appendChild(tdPacient);
                tr.appendChild(tdMetge);
                rowsEl.appendChild(tr);
            });

            resultsEl.hidden = false;
        };

        const loadVisites = async (dateValue = null, endDateValue = null) => {
            setMessage('Carregant informe de visites...');
            resultsEl.hidden = true;

            const params = [];
            if (dateValue) {
                params.push('start_date=' + encodeURIComponent(dateValue));
            }
            if (endDateValue) {
                params.push('end_date=' + encodeURIComponent(endDateValue));
            }

            const response = await fetch('/api/informes/visites' + (params.length ? '?' + params.join('&') : ''));
            const payload = await response.json();

            if (!response.ok || payload.ok === false) {
                setMessage(payload.error || 'No s han pogut carregar les dades.', true);
                rowsEl.innerHTML = '';
                emptyEl.hidden = true;
                resultsEl.hidden = true;
                return;
            }

            setMessage('Informe carregat correctament.');
            renderRows(Array.isArray(payload.data) ? payload.data : []);
        };

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const dateValue = dateInput.value;
            const endDateValue = endDateInput.value;
            if (!dateValue && !endDateValue) {
                loadVisites();
                return;
            }

            const effectiveDateValue = dateValue || endDateValue;

            if (dateValue && endDateValue && dateValue > endDateValue) {
                setMessage("La data d'inici ha de ser anterior o igual a la data de fi.", true);
                return;
            }

            loadVisites(effectiveDateValue, endDateValue || null);
        });

        loadVisites();
    </script>
</body>
</html>
